<section id="model">
  <div class="sec-head"><span class="label">03 · 3D 근거 검토</span><h2>도면 벡터에서 바로 세운 3D, 버전을 바꾸면 틀린 방이 보입니다</h2>
  <p>손으로 모델링하지 않았습니다. PDF의 벽·창호·기둥 레이어와 실측한 바닥 영역을 그대로 세웠습니다. 방을 누르면 실측 면적과 AI 값, AI가 쓴 산출 근거가 나옵니다.</p></div>
  <div class="m3-bar">
    <div class="tabs" role="tablist" aria-label="층 선택" id="m3floor">
      <button data-f="ALL" aria-selected="true">전체</button><button data-f="B1" aria-selected="false">B1</button><button data-f="2F" aria-selected="false">2F</button><button data-f="3F" aria-selected="false">3F</button>
    </div>
    <div class="tabs" role="tablist" aria-label="색 기준" id="m3mode">
      <button data-m="code" aria-selected="true">마감 코드</button><button data-m="v2" aria-selected="false">AI 오차 v2</button><button data-m="v6" aria-selected="false">AI 오차 v6</button>
    </div>
    <button class="m3-tour" id="m3tour" type="button">자동 둘러보기</button>
  </div>
  <div class="m3-wrap">
    <div class="m3-stage" id="m3stage"><canvas id="m3canvas" aria-label="3층 건물 바닥 마감 3D 모델"></canvas>
      <div class="m3-tip" id="m3tip" hidden></div>
      <div class="m3-legend" id="m3legend"></div>
      <div class="m3-fallback" id="m3fallback" hidden>이 기기에서는 3D를 표시할 수 없습니다. 위의 평면 지도에서 같은 내용을 볼 수 있습니다.</div>
    </div>
    <div class="basis m3-info" id="m3info"><span class="label">방을 눌러 보세요</span><span>회색은 마감 코드가 없는 실(화장실·서버실 등), 반투명 선은 창호입니다. 드래그로 돌리고, 휠이나 두 손가락으로 확대합니다.</span></div>
  </div>
</section>
<style>
.m3-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
